name: Build and Release Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  IMAGE_NAME: google-drive-telegram-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # create-release / upload-release-asset 需要写权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支：latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            # tag 构建：使用 tag 本身，例如 v1.0.0
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 只有打 tag (v*) 时才创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Generate image info file
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Docker image pushed to Docker Hub:" > image-info.txt
          echo "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> image-info.txt
          echo "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> image-info.txt

      - name: Upload image info as release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./image-info.txt
          asset_name: image-info.txt
          asset_content_type: text/plain
